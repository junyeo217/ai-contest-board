name: Build and deploy contest board
on:
  push:
    branches: [main]
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate crawlable HTML from contest data
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir -p _site/overseas _site/data
          cp index.html sitemap.xml llms.txt _site/
          cp overseas/index.html _site/overseas/
          cp data/contests.json data/overseas-contests.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
